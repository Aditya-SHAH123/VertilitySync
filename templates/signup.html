<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — VitalitySync</title>
    <style>
        /* Mirrors login.html's design system exactly - same dark, minimal,
           no-marketing-media page, just a different form. */
        :root {
            --bg: #0b0f16; --panel: #131923; --line: #1f2836;
            --text: #e6ebf2; --muted: #8b98ab; --accent: #3b82f6;
            --danger: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: var(--bg); color: var(--text); padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card { width: 100%; max-width: 400px; }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
        .brand .mark { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(140deg, #3b82f6, #1e40af); }
        .brand .name { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
        h1 { font-size: 1.35rem; margin: 0 0 6px; letter-spacing: -0.02em; }
        .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 24px; }

        form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
        input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
                border-radius: 6px; padding: 10px 12px; font-size: 0.92rem; margin-bottom: 16px; }
        input:focus { outline: none; border-color: var(--accent); }
        .hint { font-size: 0.72rem; color: var(--muted); margin: -12px 0 16px; }
        button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 6px;
                 padding: 11px; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
        button:hover:not(:disabled) { background: #2563eb; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }

        .error { display: none; background: #2a1416; border: 1px solid #5b2226; color: var(--danger);
                 border-radius: 6px; padding: 10px 12px; font-size: 0.85rem; margin-bottom: 16px; }
        .error.visible { display: block; }
        .info { display: none; background: #10281c; border: 1px solid #1f4d36; color: #6ee7b7;
                border-radius: 6px; padding: 10px 12px; font-size: 0.85rem; margin-bottom: 16px; }
        .info.visible { display: block; }

        .foot { margin-top: 18px; font-size: 0.75rem; color: var(--muted); line-height: 1.6; }
        .foot a { color: var(--accent); }
        .back { display: inline-block; margin-top: 20px; color: var(--muted); font-size: 0.82rem; text-decoration: none; }
        .back:hover { color: var(--text); }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="mark"></div>
        <div class="name">VitalitySync</div>
    </div>

    <h1>Create Account</h1>
    <p class="sub">Register as a doctor to start building your patient and imaging history.</p>

    <form id="signupForm" autocomplete="on">
        <div class="error" id="errorBox"></div>
        <div class="info" id="infoBox"></div>

        <label for="displayName">Full name</label>
        <input type="text" id="displayName" name="displayName" autocomplete="name" required maxlength="120">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="12">
        <div class="hint">At least 12 characters.</div>

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="12">

        <button type="submit" id="submitBtn">Create Account</button>
    </form>

    <p class="foot">
        Passwords are stored only as salted hashes, never in plaintext.
        Already have an account? <a href="/login">Sign in</a>.
    </p>

    <a class="back" href="/">&larr; Back to vitalitysync.com</a>
</div>

<script>
(function () {
    const form = document.getElementById('signupForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    let confirmationPending = false;

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('visible');

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (password !== confirmPassword) {
            errorBox.textContent = 'Passwords do not match.';
            errorBox.classList.add('visible');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account…';

        try {
            const resp = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    display_name: document.getElementById('displayName').value,
                    email: document.getElementById('email').value,
                    password: password,
                }),
            });
            const data = await resp.json();
            if (!resp.ok) {
                errorBox.textContent = data.message || 'Could not create account.';
                errorBox.classList.add('visible');
                return;
            }
            if (data.status === 'CONFIRMATION_REQUIRED') {
                document.getElementById('infoBox').textContent = data.message;
                document.getElementById('infoBox').classList.add('visible');
                form.querySelectorAll('input').forEach((el) => { el.disabled = true; });
                submitBtn.textContent = 'Check your email';
                confirmationPending = true;
                return;
            }
            window.location.href = data.redirect || '/home';
        } catch (err) {
            errorBox.textContent = 'Network error while creating your account.';
            errorBox.classList.add('visible');
        } finally {
            if (!confirmationPending) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        }
    });
})();
</script>
</body>
</html>
