<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}VitalitySync{% endblock %}</title>
<style>
    /* PATIENT WORKFLOW DESIGN SYSTEM
       Light, restrained, Apple-software-inspired: soft white ground, near-black
       text, one cool medical accent, subtle borders instead of heavy shadows.
       Deliberately separate from the dark clinical-case pages (cases.html,
       case_workspace.html, dashboard.html) and from the always-dark viewer -
       see structure.txt / ARCHITECTURE_AUDIT.md for why those were left alone. */
    :root {
        --bg: #f7f7f8; --panel: #ffffff; --line: #e6e6e9; --text: #1d1d1f;
        --muted: #6e6e73; --dim: #a3a3a8; --accent: #0071c2; --accent-soft: #eaf3fb;
        --ok: #1a8754; --ok-soft: #e7f6ee; --warn: #a15c00; --warn-soft: #fdf0dc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px;
           font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4 { margin: 0; }

    .shell { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
    .side { background: var(--panel); border-right: 1px solid var(--line);
            padding: 18px 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .side .brand { display: flex; align-items: center; gap: 9px; padding: 4px 20px 20px; font-weight: 650; font-size: 0.95rem; }
    .side .mark { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(140deg, #0071c2, #00396b); flex-shrink: 0; }
    .side .grp { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--dim); padding: 16px 20px 6px; }
    .side nav a { display: block; padding: 8px 20px; color: var(--muted); font-size: 0.86rem;
                  border-left: 2px solid transparent; transition: background 0.15s, color 0.15s; }
    .side nav a:hover { color: var(--text); background: #f2f2f3; }
    .side nav a.on { color: var(--text); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .side .bottom { margin-top: auto; }

    .main { padding: 32px 40px 64px; max-width: 1080px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    .search-box { position: relative; max-width: 360px; width: 100%; }
    .search-box input { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
                         border-radius: 9px; padding: 9px 13px; font-size: 0.86rem; font-family: inherit; }
    .search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .btn { border: none; border-radius: 8px; padding: 8px 16px; font-size: 0.84rem; font-weight: 600;
           cursor: pointer; font-family: inherit; transition: background 0.15s, opacity 0.15s, transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #00619e; }
    .btn-sub { background: #f2f2f3; color: var(--text); border: 1px solid var(--line); }
    .btn-sub:hover { background: #e9e9ea; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .btn-ghost:hover { color: var(--text); background: #f5f5f6; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    input, select, textarea { font-family: inherit; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em;
         color: var(--dim); font-weight: 600; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 0.87rem; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { cursor: pointer; transition: background 0.12s; }
    tbody tr:hover { background: #fafafb; }

    .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
    .empty p { margin: 0 0 16px; font-size: 0.88rem; }

    dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line);
             border-radius: 14px; padding: 22px; width: min(440px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,0.35); }
    dialog[open] { animation: dlgIn 0.18s ease; }
    @keyframes dlgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    dialog h2 { font-size: 1rem; margin-bottom: 16px; }
    dialog label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em;
                   color: var(--dim); margin: 12px 0 5px; }
    dialog label:first-of-type { margin-top: 0; }
    dialog input, dialog select, dialog textarea {
        width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
        border-radius: 8px; padding: 9px 11px; font-size: 0.86rem;
    }
    dialog input:focus, dialog select:focus, dialog textarea:focus { outline: none; border-color: var(--accent); }
    .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .field-error { color: #c0392b; font-size: 0.78rem; margin-top: 6px; min-height: 1em; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .tabs button { background: none; border: none; font-family: inherit; font-size: 0.85rem; font-weight: 600;
                   color: var(--muted); padding: 10px 4px; margin-right: 22px; cursor: pointer;
                   border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
    .tabs button:hover { color: var(--text); }
    .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
    .tab-panel { animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .pill { display: inline-block; padding: 2px 10px; border-radius: 100px; font-size: 0.7rem; font-weight: 600; }
    .pill.ready { background: var(--ok-soft); color: var(--ok); }
    .pill.processing { background: var(--warn-soft); color: var(--warn); }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
    @media (max-width: 820px) {
        .shell { grid-template-columns: 1fr; }
        .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; }
        .side .brand, .side .grp { display: none; }
        .side nav { display: flex; }
        .side nav a { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; }
        .side nav a.on { border-bottom-color: var(--accent); }
        .main { padding: 20px 18px 48px; }
    }
    {% block extra_style %}{% endblock %}
</style>
</head>
<body>
<div class="shell">
    <aside class="side">
        <div class="brand"><span class="mark"></span>VitalitySync</div>
        <nav>
            <a href="/home" class="{{ 'on' if active == 'overview' else '' }}">Overview</a>
            <a href="/patients" class="{{ 'on' if active == 'patients' else '' }}">Patients</a>
            <a href="/dashboard" class="{{ 'on' if active == 'imaging' else '' }}">Imaging</a>
            <a href="/patients" class="{{ 'on' if active == 'recent' else '' }}">Recent</a>
        </nav>
        <div class="bottom">
            <div class="grp">Account</div>
            <nav>
                <a href="/cases">Cases (legacy)</a>
                <a href="/logout">Sign Out</a>
            </nav>
        </div>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>
{% block extra_scripts %}{% endblock %}
</body>
</html>
