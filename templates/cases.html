<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cases — VitalitySync</title>
    <style>
        /* CLINICAL DESIGN SYSTEM
           Dense, fast, minimal motion. Shares brand identity (mark, name,
           typeface) with the public site but none of its cinematic styling.
           No marketing media is loaded on any authenticated page. */
        :root {
            --bg: #0b0f16; --panel: #131923; --panel2: #171e2a; --line: #1f2836;
            --text: #e6ebf2; --muted: #8b98ab; --dim: #64728a; --accent: #3b82f6;
            --ok: #34d399; --warn: #fbbf24; --info: #60a5fa; --off: #64748b;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        a { color: inherit; text-decoration: none; }

        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px;
                  padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
        .brand { display: flex; align-items: center; gap: 9px; }
        .brand .mark { width: 20px; height: 20px; border-radius: 5px; background: linear-gradient(140deg, #3b82f6, #1e40af); }
        .brand .name { font-weight: 650; font-size: 0.9rem; }
        .search { flex: 1; max-width: 420px; }
        .search input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
                        border-radius: 6px; padding: 7px 11px; font-size: 0.85rem; }
        .search input:focus { outline: none; border-color: var(--accent); }
        .who { display: flex; align-items: center; gap: 12px; font-size: 0.82rem; color: var(--muted); }
        .who a { color: var(--muted); }
        .who a:hover { color: var(--text); }

        .shell { display: grid; grid-template-columns: 190px 1fr; min-height: calc(100vh - 45px); }
        .side { border-right: 1px solid var(--line); padding: 14px 0; background: var(--panel); }
        .side .grp { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em;
                     color: var(--dim); padding: 10px 18px 5px; }
        .side a { display: block; padding: 7px 18px; color: var(--muted); font-size: 0.85rem; }
        .side a:hover { color: var(--text); background: var(--panel2); }
        .side a.on { color: var(--text); box-shadow: inset 2px 0 0 var(--accent); background: var(--panel2); }

        .main { padding: 20px 22px 60px; }
        .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
        h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
        .btn { border: none; border-radius: 6px; padding: 7px 14px; font-size: 0.82rem; font-weight: 600;
               cursor: pointer; font-family: inherit; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-sub { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
        .btn-sub:hover { color: var(--text); }

        .filters { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .filters button { background: var(--panel2); color: var(--muted); border: 1px solid var(--line);
                          border-radius: 100px; padding: 5px 13px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
        .filters button:hover { color: var(--text); }
        .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

        table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
                border-radius: 8px; overflow: hidden; }
        th { text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.09em;
             color: var(--dim); font-weight: 600; padding: 9px 14px; border-bottom: 1px solid var(--line); }
        td { padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
        tr:last-child td { border-bottom: none; }
        tbody tr { cursor: pointer; }
        tbody tr:hover { background: var(--panel2); }
        .ref { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; color: var(--muted); }

        .pill { display: inline-block; padding: 2px 9px; border-radius: 100px; font-size: 0.7rem; font-weight: 600; }
        .pill.needs_review { background: #422006; color: var(--warn); }
        .pill.processing { background: #172554; color: var(--info); }
        .pill.ready { background: #052e21; color: var(--ok); }
        .pill.archived { background: #1e293b; color: var(--off); }
        .demo-tag { font-size: 0.66rem; color: var(--dim); border: 1px solid var(--line);
                    border-radius: 4px; padding: 1px 6px; margin-left: 7px; }

        .empty { padding: 46px 20px; text-align: center; color: var(--muted); background: var(--panel);
                 border: 1px solid var(--line); border-radius: 8px; }
        .empty p { margin: 0 0 14px; font-size: 0.88rem; }

        dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line);
                 border-radius: 10px; padding: 20px; width: min(420px, 92vw); }
        dialog::backdrop { background: rgba(0,0,0,0.6); }
        dialog h2 { margin: 0 0 14px; font-size: 0.95rem; }
        dialog label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
                       color: var(--dim); margin-bottom: 5px; }
        dialog input, dialog select { width: 100%; background: var(--bg); border: 1px solid var(--line);
                       color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 0.85rem; margin-bottom: 14px;
                       font-family: inherit; }
        .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; }

        @media (max-width: 780px) {
            .shell { grid-template-columns: 1fr; }
            .side { display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 6px; }
            .side .grp { display: none; }
            .side a.on { box-shadow: inset 0 -2px 0 var(--accent); }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            td { border-bottom: none; padding: 4px 14px; }
            tbody tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="brand"><span class="mark"></span><span class="name">VitalitySync</span></div>
    <div class="search"><input type="search" id="searchInput" placeholder="Search cases by title or reference…"></div>
    <div class="who"><span>{{ doctor_name }}</span><a href="/logout">Sign out</a></div>
</div>

<div class="shell">
    <aside class="side">
        <div class="grp">Workspace</div>
        <a class="on" href="/cases">Cases</a>
        <a href="/dashboard">Imaging Import</a>
        <div class="grp">Account</div>
        <a href="/logout">Sign out</a>
    </aside>

    <main class="main">
        <div class="head">
            <h1>Cases</h1>
            <button class="btn btn-primary" id="newCaseBtn">New Case</button>
        </div>

        <div class="filters" id="filters">
            <button data-status="" class="on">All</button>
            <button data-status="needs_review">Needs Review</button>
            <button data-status="processing">Processing</button>
            <button data-status="ready">Ready</button>
            <button data-status="archived">Archived</button>
        </div>

        <div id="tableWrap"></div>
    </main>
</div>

<dialog id="newCaseDlg">
    <h2>New Case</h2>
    <form method="dialog" id="newCaseForm">
        <label for="caseTitle">Title</label>
        <input type="text" id="caseTitle" required maxlength="160" placeholder="e.g. Chest CT — follow-up interval">
        <label for="caseStatus">Status</label>
        <select id="caseStatus">
            <option value="needs_review">Needs Review</option>
            <option value="processing">Processing</option>
            <option value="ready">Ready</option>
        </select>
        <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:0.8rem;color:var(--muted);">
            <input type="checkbox" id="caseDemo" style="width:auto;margin:0;"> Mark as a demonstration record
        </label>
        <div class="dlg-actions" style="margin-top:14px;">
            <button type="button" class="btn btn-sub" id="cancelCase">Cancel</button>
            <button type="button" class="btn btn-primary" id="createCase">Create</button>
        </div>
    </form>
</dialog>

<script>
(function () {
    const tableWrap = document.getElementById('tableWrap');
    const searchInput = document.getElementById('searchInput');
    const dlg = document.getElementById('newCaseDlg');
    let status = '', q = '';

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function fmt(iso) {
        if (!iso) return '—';
        try { return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
        catch (e) { return iso.slice(0, 10); }
    }

    async function load() {
        const params = new URLSearchParams();
        if (status) params.set('status', status);
        if (q) params.set('q', q);
        const resp = await fetch('/api/cases?' + params.toString());
        if (resp.status === 401) { window.location.href = '/login'; return; }
        const data = await resp.json();
        render(data.cases || []);
    }

    function render(cases) {
        if (!cases.length) {
            tableWrap.innerHTML = '<div class="empty"><p>No cases match this view.</p>' +
                '<button class="btn btn-primary" id="emptyNew">Create your first case</button></div>';
            const b = document.getElementById('emptyNew');
            if (b) b.addEventListener('click', function () { dlg.showModal(); });
            return;
        }
        tableWrap.innerHTML =
            '<table><thead><tr>' +
            '<th>Reference</th><th>Title</th><th>Status</th><th>Imaging</th><th>Updated</th>' +
            '</tr></thead><tbody>' +
            cases.map(function (c) {
                return '<tr data-ref="' + esc(c.case_ref) + '">' +
                    '<td class="ref">' + esc(c.case_ref) + '</td>' +
                    '<td>' + esc(c.title) + (c.is_demo ? '<span class="demo-tag">DEMO RECORD</span>' : '') + '</td>' +
                    '<td><span class="pill ' + esc(c.status) + '">' + esc(c.status_label) + '</span></td>' +
                    '<td>' + (c.study_id ? 'Linked' : '<span style="color:var(--dim)">None</span>') + '</td>' +
                    '<td>' + esc(fmt(c.updated_at)) + '</td>' +
                    '</tr>';
            }).join('') +
            '</tbody></table>';

        tableWrap.querySelectorAll('tbody tr').forEach(function (tr) {
            tr.addEventListener('click', function () {
                window.location.href = '/cases/' + encodeURIComponent(tr.getAttribute('data-ref'));
            });
        });
    }

    document.querySelectorAll('#filters button').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('#filters button').forEach(function (x) { x.classList.remove('on'); });
            b.classList.add('on');
            status = b.getAttribute('data-status');
            load();
        });
    });

    let searchTimer = null;
    searchInput.addEventListener('input', function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () { q = searchInput.value.trim(); load(); }, 220);
    });

    document.getElementById('newCaseBtn').addEventListener('click', function () { dlg.showModal(); });
    document.getElementById('cancelCase').addEventListener('click', function () { dlg.close(); });
    document.getElementById('createCase').addEventListener('click', async function () {
        const title = document.getElementById('caseTitle').value.trim();
        if (!title) return;
        const resp = await fetch('/api/cases', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: title,
                status: document.getElementById('caseStatus').value,
                is_demo: document.getElementById('caseDemo').checked,
            }),
        });
        if (resp.ok) {
            dlg.close();
            document.getElementById('caseTitle').value = '';
            load();
        }
    });

    load();
})();
</script>
</body>
</html>
